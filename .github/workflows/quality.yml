name: ERP Quality

on:
  push:
    branches: [main, test-branch]
  pull_request:
    branches: [main, test-branch]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ERP quality gates
        run: npm run qa