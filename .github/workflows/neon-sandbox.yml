name: Neon Sandbox

on:
  push:
    branches: [test-branch]
  pull_request_target:
    branches: [test-branch]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-sandbox-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Resolve sandbox branch names
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "neon_branch_name=credencecraft-sandbox-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "vercel_branch_ref=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "neon_branch_name=credencecraft-sandbox-test-branch" >> "$GITHUB_OUTPUT"
            echo "vercel_branch_ref=${PUSH_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse schema-only Neon sandbox branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ steps.context.outputs.neon_branch_name }}
          branch_type: schema-only
          suspend_timeout: 300
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Mask sandbox connection strings
        shell: bash
        env:
          SANDBOX_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          SANDBOX_DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          echo "::add-mask::$SANDBOX_DATABASE_URL"
          echo "::add-mask::$SANDBOX_DATABASE_URL_UNPOOLED"

      - name: Verify the Neon branch is non-primary
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_BRANCH_NAME: ${{ steps.context.outputs.neon_branch_name }}
        run: node scripts/verify-neon-branch.cjs

      - name: Synchronize branch-scoped Vercel Preview variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SANDBOX_VERCEL_BRANCH_REF: ${{ steps.context.outputs.vercel_branch_ref }}
          SANDBOX_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          SANDBOX_DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_BRANCH_NAME: ${{ steps.context.outputs.neon_branch_name }}
        run: node scripts/sync-vercel-preview-env.cjs upsert

      - name: Deploy and verify Vercel Preview after environment sync
        timeout-minutes: 20
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SANDBOX_VERCEL_BRANCH_REF: ${{ steps.context.outputs.vercel_branch_ref }}
          SANDBOX_GIT_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          SANDBOX_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/deploy-vercel-preview.cjs

  cleanup:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Remove branch-scoped Vercel Preview variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SANDBOX_VERCEL_BRANCH_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/sync-vercel-preview-env.cjs remove

      - name: Delete the closed pull request Neon sandbox branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: credencecraft-sandbox-pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
